<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f8fb" />
    <meta
      name="description"
      content="Daymo is a simple, local-first calendar for iPhone and Android. See your days clearly and manage the calendars already on your phone."
    />
    <meta property="og:title" content="Daymo — Your week at a glance" />
    <meta
      property="og:description"
      content="A focused, local-first calendar for iPhone and Android."
    />
    <meta property="og:image" content="assets/daymo-social.jpg" />
    <meta property="og:type" content="website" />
    <title>Daymo — Your week at a glance</title>
    <link rel="icon" href="assets/daymo-icon.png" />
    <style>
      :root {
        color-scheme: light;
        --ink: #10131a;
        --muted: #646b78;
        --line: #e4e8ef;
        --surface: #ffffff;
        --wash: #f6f8fb;
        --blue: #087df1;
        --blue-dark: #0066cc;
        --radius: 24px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: var(--wash);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
      }

      img {
        display: block;
        max-width: 100%;
      }

      .shell {
        width: min(100% - 40px, 1120px);
        margin-inline: auto;
      }

      .header {
        position: relative;
        z-index: 10;
        display: flex;
        min-height: 76px;
        align-items: center;
        justify-content: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 18px;
        font-weight: 720;
        letter-spacing: -0.02em;
        text-decoration: none;
      }

      .brand img {
        width: 34px;
        height: 34px;
        border-radius: 9px;
      }

      .hero {
        overflow: hidden;
        padding: 70px 0 0;
      }

      .hero-copy {
        text-align: center;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 22px;
        color: var(--blue-dark);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--blue);
        content: "";
        box-shadow: 0 0 0 5px rgba(8, 125, 241, 0.1);
      }

      h1 {
        max-width: 820px;
        margin: 0 auto;
        font-size: clamp(46px, 12vw, 88px);
        font-weight: 740;
        letter-spacing: -0.065em;
        line-height: 0.96;
      }

      .hero-copy > p {
        max-width: 600px;
        margin: 26px auto 0;
        color: var(--muted);
        font-size: clamp(18px, 4.8vw, 21px);
        line-height: 1.55;
      }

      .store-links {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin: 30px auto 0;
      }

      .store-link {
        display: inline-flex;
        min-height: 56px;
        align-items: center;
        justify-content: center;
        gap: 11px;
        border: 1px solid var(--ink);
        border-radius: 16px;
        background: var(--ink);
        color: white;
        padding: 0 21px;
        font-size: 15px;
        font-weight: 650;
        text-decoration: none;
        transition: background 160ms ease, transform 160ms ease;
      }

      .store-link:hover {
        background: #292d35;
        transform: translateY(-2px);
      }

      .store-link svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }

      .hero-visual {
        position: relative;
        height: 460px;
        overflow: hidden;
        margin-top: 58px;
        border-radius: 32px;
      }

      .hero-visual img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      .footer {
        display: flex;
        flex-direction: column;
        gap: 18px;
        align-items: flex-start;
        border-top: 1px solid var(--line);
        padding: 27px 0 34px;
        color: var(--muted);
        font-size: 14px;
      }

      .footer-links {
        display: flex;
        gap: 20px;
      }

      .footer a:hover {
        color: var(--ink);
      }

      :focus-visible {
        outline: 3px solid rgba(8, 125, 241, 0.35);
        outline-offset: 3px;
      }

      @media (min-width: 580px) {
        .store-links {
          width: max-content;
          flex-direction: row;
        }

        .hero-visual {
          height: 560px;
        }

        .footer {
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
        }
      }

      @media (min-width: 800px) {
        .shell {
          width: min(100% - 64px, 1120px);
        }

        .header {
          min-height: 88px;
        }

        .hero {
          padding-top: 96px;
        }

        .hero-visual {
          height: auto;
          aspect-ratio: 1400 / 771;
          margin-top: 78px;
          border-radius: 44px;
        }

      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="header shell">
      <a class="brand" href="#top" aria-label="Daymo home">
        <img src="assets/daymo-icon.png" alt="" />
        <span>Daymo</span>
      </a>
    </header>

    <main id="top">
      <section class="hero">
        <div class="hero-copy shell">
          <div class="eyebrow">Stay organized</div>
          <h1>Your week<br />at a glance.</h1>
          <p>
            Daymo turns the calendars already on your phone into one calm, focused agenda. No new
            account. No new system to maintain.
          </p>
          <div class="store-links" aria-label="Download Daymo">
            <a
              class="store-link"
              href="https://apps.apple.com/app/daymo/id6762902133"
              aria-label="Download Daymo on the App Store"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M17.05 12.54c.03-3 2.45-4.44 2.56-4.51a5.5 5.5 0 0 0-4.34-2.35c-1.82-.2-3.58 1.09-4.5 1.09-.94 0-2.36-1.07-3.9-1.04a5.73 5.73 0 0 0-4.81 2.94c-2.1 3.64-.54 9 1.48 11.94 1.01 1.44 2.2 3.05 3.74 3 1.5-.06 2.06-.96 3.88-.96 1.8 0 2.33.96 3.9.92 1.62-.02 2.64-1.45 3.61-2.9a11.9 11.9 0 0 0 1.66-3.39 5.2 5.2 0 0 1-3.28-4.74ZM14.08 3.75A5.3 5.3 0 0 0 15.3 0a5.4 5.4 0 0 0-3.5 1.78 5 5 0 0 0-1.26 3.6 4.47 4.47 0 0 0 3.54-1.63Z" />
              </svg>
              Download for iPhone
            </a>
            <a
              class="store-link"
              href="https://play.google.com/store/apps/details?id=io.flown.daymo"
              aria-label="Get Daymo on Google Play"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3.4 2.2a2 2 0 0 0-.4 1.2v17.2c0 .48.17.9.45 1.22L13.1 12 3.4 2.2Zm10.85 10.96-2.2 2.22-7.55 6.28c.2.08.4.13.63.13.34 0 .7-.1 1.06-.3l11.18-6.36-3.12-1.97ZM21 10.31l-2.34-1.33-3.31 3.08 3.35 2.03L21 12.78c.66-.38 1-.8 1-1.24 0-.45-.34-.86-1-1.23ZM4.46 2.31l7.6 6.34 2.15 2.18 3.16-2.95L6.2 1.52A2.32 2.32 0 0 0 5.1 1.2c-.23 0-.44.04-.64.11Z" />
              </svg>
              Get it on Android
            </a>
          </div>
        </div>

        <div class="hero-visual shell">
          <img
            src="assets/daymo-social.jpg"
            alt="Daymo agenda displayed on an iPhone beside the ocean"
          />
        </div>
      </section>

    </main>

    <footer class="footer shell">
      <div class="footer-links">
        <a href="https://flown.io/privacypolicy">Privacy</a>
        <a href="https://github.com/simonbengtsson/daymo">GitHub</a>
      </div>
    </footer>
  </body>
</html>
